---
name: CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      sbom_scan_failure_threshold:
        description: "Threshold to fail the SBOM scan."
        type: choice
        options:
          - low
          - medium
          - high
          - critical
        default: medium
  schedule:
    - cron: "00 12 * * *"

permissions:
  contents: read

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    env:
      GRYPE_FAILURE_THRESHOLD: ${{ github.event.inputs.sbom_scan_failure_threshold || 'medium' }}

    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Semgrep
        run: pipx install semgrep

      - name: Install TruffleHog
        run: |
          curl -sSfL \
            https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sudo sh -s -- -b /usr/local/bin v3.97.5

      - name: Install yq
        run: |
          sudo wget \
            https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Add Syft to PATH
        run: echo "$(dirname '${{ steps.syft.outputs.cmd }}')" >> "$GITHUB_PATH"

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      - name: Add Grype to PATH
        run: echo "$(dirname '${{ steps.grype.outputs.cmd }}')" >> "$GITHUB_PATH"

      - name: Run CI Pipeline
        run: make build
